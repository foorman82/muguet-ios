   name: build-ios
   on: workflow_dispatch
   jobs:
     build:
       runs-on: macos-26
       timeout-minutes: 180
       steps:
         - uses: actions/checkout@v4
         - run: brew install xcodegen
         - run: |
             rustup toolchain install 1.98.1
             rustup target add aarch64-apple-ios --toolchain 1.98.1
         - run: curl -L -o game.zip "${{ secrets.GAME_ZIP_URL }}"
         - run: BUNDLE_ID=com.foorman.muguet ./make-ios.sh game.zip --ipa
         - uses: actions/upload-artifact@v4
           with:
             name: Muguet
             path: build/Muguet.ipa
